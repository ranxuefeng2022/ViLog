<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <!-- 🚀 字体预连接 + 异步加载，不阻塞首屏渲染 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap"
      rel="stylesheet"
      media="print" onload="this.media='all'"
    />
    <meta charset="UTF-8" />
    <title>VivoLog - 日志查看器</title>
    <link rel="icon" type="image/png" href="../icons/icon.png">
    <link rel="stylesheet" href="renderer/css/components/base-layout.css">
    <link rel="stylesheet" href="renderer/css/components/log-content.css">
    <link rel="stylesheet" href="renderer/css/components/file-tree.css">
    <link rel="stylesheet" href="renderer/css/components/menus.css">
    <link rel="stylesheet" href="renderer/css/components/panels.css">
    <link rel="stylesheet" href="renderer/css/components/csv-table.css">
    <link rel="stylesheet" href="renderer/css/components/progress-bar.css">
    <link rel="stylesheet" href="renderer/css/components/virtual-scroll.css">
    <link rel="stylesheet" href="renderer/css/components/secondary-filter.css">
    <link rel="stylesheet" href="renderer/css/components/csv-chart.css">
    <link rel="stylesheet" href="renderer/css/components/dynamic-island.css">
    <!-- 🚀 外部库延迟加载，不阻塞 HTML 解析和首屏渲染 -->
    <script src="lib/jszip.min.js"></script>
    <script src="lib/papaparse.min.js"></script>
    <script src="lib/marked.min.js"></script>
    <script src="lib/highlight.min.js"></script>
    <script src="lib/mermaid.min.js"></script>
    <link rel="stylesheet" href="lib/katex.min.css">
    <script src="lib/katex.min.js"></script>
  </head>
  <body>
    <!-- 窗口控制按钮 — fixed 右上角，hover 才显示 -->
    <div id="windowControls">
      <button id="wcClose" onclick="closeWindow()" title="关闭"></button>
      <button id="wcMinimize" onclick="minimizeWindow()" title="最小化"></button>
      <button id="wcMaximize" onclick="maximizeWindow()" title="最大化"></button>
      <span id="windowDragHandle" title="拖拽移动窗口"></span>
    </div>
    <div id="headerProgressLine"><div id="headerProgressFill"></div></div>

    <!-- 浮动搜索框 — Ctrl+F 弹出，可拖拽 -->
    <div id="searchFloatingBar">
      <div id="searchFloatingBarHandle" title="拖拽移动">⣿</div>
      <input type="text" id="searchBox" placeholder="搜索..." />
      <div id="searchSuggestions" class="filter-suggestions"></div>
      <span id="searchStatus"></span>
      <button id="prevBtn" onclick="prevMatch()" disabled>↑</button>
      <button id="nextBtn" onclick="nextMatch()" disabled>↓</button>
      <button id="searchCloseBtn" onclick="closeFloatingSearch()">×</button>
    </div>

    <!-- 过滤输入框 -->
    <div id="filterFloatingBar">
      <input type="text" id="filterBox" placeholder="关键词 (| 分隔)..." />
      <button id="expandFilterBtn" title="展开">+</button>
      <div id="filterSuggestions" class="filter-suggestions"></div>
    </div>

    <!-- 隐藏状态元素（JS 引用保留） -->
    <div id="hiddenStatus" style="display:none;">
      <span id="status"></span>
      <span id="fileInfo" class="file-info"></span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- 文件树容器 -->
    <div id="fileTreeContainer" tabindex="0">
      <div id="fileTreeResizer"></div>
<div class="file-tree-search-container">
        <input type="text" id="fileTreeSearch" placeholder="搜索文件..." />
        <button type="button" class="file-tree-search-clear" aria-label="清除搜索">&times;</button>
      </div>
      <div id="fileTreeTabBar" class="file-tree-tab-bar">
        <button class="file-tree-tab active" data-tab="__local_drives__">本地磁盘</button>
        <button class="file-tree-tab" data-tab="__network_drives__">网络驱动器</button>
        <button class="file-tree-tab" data-tab="__other_drives__">其他</button>
        <button class="file-tree-tab" data-tab="__frequent_access__">常用访问</button>
      </div>
      <div id="fileTreeList" tabindex="0">
        <div class="file-tree-empty">
          <svg width="36" height="36" viewBox="0 0 16 16"><path d="M2 5h5l2-2h5v10H2z" fill="#82AFCB"/></svg>
          <span class="empty-title">拖入文件或文件夹到此处</span>
          <span class="empty-hint">支持 Ctrl+V 粘贴文件路径</span>
        </div>
      </div>
    </div>

    <!-- Ctrl+G 悬浮文件树遮罩（仅在悬浮模式下显示） -->
    <div id="fileTreeFloatingOverlay" aria-hidden="true"></div>

    <!-- 文件树右键菜单 -->
    <div id="fileTreeContextMenu" role="menu" aria-hidden="true">
      <div class="menu-group">
        <button id="fileTreeCtxCopyName" type="button" class="menu-item">
          <span class="icon">📋</span>
          <span class="text">复制名称</span>
        </button>
        <button id="fileTreeCtxDeleteFile" type="button" class="menu-item">
          <span class="icon">🗑️</span>
          <span class="text">删除文件</span>
        </button>
        <button id="fileTreeCtxRefresh" type="button" class="menu-item">
          <span class="icon">🔄</span>
          <span class="text">刷新</span>
        </button>
      </div>
      <div class="menu-group">
        <button id="fileTreeCtxExtractArchive" type="button" class="menu-item">
          <span class="icon">📦</span>
          <span class="text">解压到当前目录</span>
        </button>
        <button id="fileTreeCtxExportCsv" type="button" class="menu-item">
          <span class="icon">📊</span>
          <span class="text">日志分析</span>
        </button>
      </div>
      <div class="menu-group">
        <button id="fileTreeCtxRemoveFrequent" type="button" class="menu-item">
          <span class="icon">⭐</span>
          <span class="text">从常用访问中移除</span>
        </button>
        <button id="fileTreeCtxToggleStar" type="button" class="menu-item">
          <span class="icon">🌟</span>
          <span class="text">星标/取消星标</span>
        </button>
      </div>
      <div class="menu-group">
        <button id="fileTreeCtxFilterSubtree" type="button" class="menu-item">
          <span class="icon">🔍</span>
          <span class="text">过滤当前目录</span>
        </button>
      </div>
    </div>

    <!-- 文件树子树过滤浮窗 -->
    <div id="fileTreeSubtreeFilterDialog" class="file-tree-subtree-filter-dialog" style="display: none;">
      <div class="file-tree-subtree-filter-header">
        <span class="file-tree-subtree-filter-title" id="subtreeFilterTitle">过滤当前目录</span>
        <button class="file-tree-subtree-filter-close" id="subtreeFilterClose">&times;</button>
      </div>
      <div class="file-tree-subtree-filter-body">
        <input type="text" id="subtreeFilterInput" class="file-tree-subtree-filter-input" placeholder="输入关键词过滤文件..." />
        <div class="file-tree-subtree-filter-hint">
          <span id="subtreeFilterMatchCount">0</span> 个文件匹配 · Enter 过滤 · 再次 Enter 全选
        </div>
      </div>
    </div>

    <!-- 日志内容框右键菜单 - 优化版本 -->
    <div id="logContextMenu" role="menu" aria-hidden="true">
      <div class="menu-title" id="logContextMenuTitle">日志</div>

      <!-- 文件信息区域 -->
      <div class="menu-info" id="logCtxFileInfo" style="display: none;">
        <span class="info-label">所属文件</span>
        <span class="info-value" id="logCtxFileName"></span>
      </div>

      <div class="menu-separator"></div>

      <!-- 窗口操作组 -->
      <div class="menu-group">
        <button id="logCtxNewWindow" type="button" class="menu-item">
          <span class="icon">🪟</span>
          <span class="text">新建窗口</span>
        </button>
        <button id="logCtxMinimizeAll" type="button" class="menu-item">
          <span class="icon">📉</span>
          <span class="text">最小化所有窗口</span>
        </button>
      </div>

      <div class="menu-separator"></div>

      <!-- 视图操作组 -->
      <div class="menu-group">
        <div class="menu-group-title">视图</div>
        <button id="logCtxViewAsTable" type="button" class="menu-item">
          <span class="icon">📊</span>
          <span class="text">以表格形式查看CSV</span>
        </button>
      </div>


</div>

    <!-- 文件树边框上的展开/隐藏按钮 - 始终显示 -->
    <div id="fileTreeCollapseBtn">▶</div>
    
    <!-- 移除原来的dropArea，将拖拽功能集成到outerContainer -->
    <!-- <div id="dropArea"> -->
    <!--   <div class="icon">📂</div> -->
    <!--   <p>拖放文件或文件夹到此处加载</p> -->
    <!-- </div> -->

    <div id="outerContainer">
      <div id="innerContainer"></div>
    </div>
    <div id="hScroll"><div id="hScrollContent"></div></div>

    <!-- 悬停行显示"所在文件名"的提示 -->
    <div id="lineFileHoverTip" aria-hidden="true"></div>

    <!-- 优化：悬浮过滤内容框 - 添加虚拟滚动容器和四个角调整手柄 -->
    <div id="filteredPanel">
      <!-- 顶部边缘拖拽调整高度 -->
      <div class="panel-resize-handle n" data-direction="n"></div>
      <!-- 替换原有的 filteredPanelHeader 和 filteredPanelSearchContainer -->
      <div id="filteredPanelHeader">
        <!-- 左侧：高度调节拖动按钮、最小化、关闭、最大化按钮和过滤结果计数 -->
        <div class="filtered-panel-header-left">
          <!-- 🔧 高度调节拖动按钮移到最左边 -->
          <div id="filteredPanelHeightDragHandle" title="拖动调整高度">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M3 3h10v2H3V3zm0 4h10v2H3V7zm0 4h10v2H3v-2z"/>
            </svg>
          </div>
          <button id="filteredPanelMinimize" title="最小化">─</button>
          <button id="filteredPanelClose" title="关闭">×</button>
          <button id="filteredPanelMaximize" title="最大化">□</button>
        </div>

        <!-- 中间：搜索和二级过滤 -->
        <div class="filtered-panel-header-center">
          <!-- 正则搜索 -->
          <div class="filtered-panel-input-wrapper">
            <input
              type="text"
              id="filteredPanelSearchBox"
              placeholder="正则搜索[enter/shift+enter]"
            />
            <!-- 过滤结果框搜索自动建议下拉菜单 -->
            <div id="filteredPanelSearchSuggestions" class="filter-suggestions"></div>
          </div>
          <span id="filteredPanelSearchStatus"></span>
          <button
            id="filteredPanelPrevBtn"
            onclick="filteredPanelPrevMatch()"
            disabled
          >
            ↑
          </button>
          <button
            id="filteredPanelNextBtn"
            onclick="filteredPanelNextMatch()"
            disabled
          >
            ↓
          </button>

          <!-- 二级过滤 -->
          <div class="filtered-panel-input-wrapper">
            <input
              type="text"
              id="filteredPanelFilterBox"
              placeholder="二级过滤 (支持多个关键词, 用|分隔)"
            />
            <!-- 二级过滤自动建议下拉菜单 -->
            <div id="secondaryFilterSuggestions" class="filter-suggestions"></div>
          </div>
          <span
            class="regex-status idle"
            id="filteredPanelRegexStatus"
            title="正则表达式状态"
          ></span>
          <button id="filteredPanelCopyBtn" onclick="copyFilteredLogs()" title="复制过滤结果">C</button>
          <button id="filteredPanelExportBtn" onclick="exportFilteredAsHTML()" title="导出为HTML">E</button>
          <span id="filteredPanelFilterStatus"></span>
          <!-- 单关键词过滤下拉选择器 -->
          <div id="filteredPanelKeywordContainer" class="filtered-panel-keyword-container" style="display:none">
            <span id="filteredPanelKeywordProgress" class="filtered-panel-keyword-progress"></span>
            <div class="filtered-panel-keyword-dropdown">
              <button id="filteredPanelKeywordBtn" class="filtered-panel-keyword-btn" title="滚轮切换关键词">
                <span id="filteredPanelKeywordLabel">[组合]</span>
                <span class="filtered-panel-keyword-arrow">&#9662;</span>
              </button>
              <div id="filteredPanelKeywordMenu" class="filtered-panel-keyword-menu"></div>
            </div>
          </div>
          <span class="filtered-result-info">过滤结果 <span id="filteredCount"></span> <span id="filteredTime"></span></span>
        </div>
      </div>

      <div id="filteredPanelContent">
        <div id="filteredPanelPlaceholder"></div>
        <div id="filteredPanelVirtualContent"></div>
      </div>
    </div>

    <!-- 二级过滤右侧边栏 -->
    <div id="secondaryFilterSidebar">
      <div id="secondaryFilterSidebarHeader">
        <div id="secondaryFilterHeightHandle" class="height-resize-handle" title="拖动调整高度">
          <div class="height-handle-line"></div>
          <div class="height-handle-line"></div>
          <div class="height-handle-line"></div>
        </div>
        <span class="secondary-filter-sidebar-title">二级过滤结果</span>
        <span class="secondary-filter-sidebar-count">[<span id="secondaryFilterCount">0</span> 行]</span>
      </div>
      <!-- 关键词高亮工具栏 -->
      <div id="highlightToolbar" class="highlight-toolbar">
        <input
          type="text"
          id="highlightKeywordInput"
          placeholder="高亮关键词 (按回车添加)"
          class="highlight-input"
        />
        <input
          type="color"
          id="highlightColorPicker"
          class="highlight-color-picker"
          value="#ff6347"
          title="选择高亮颜色"
        />
        <button id="addHighlightBtn" class="highlight-add-btn" title="添加高亮">+</button>
        <div id="highlightKeywordsList" class="highlight-keywords-list"></div>
        <button id="secondaryFilterSidebarMaximize" class="maximize-btn" title="最大化/还原">□</button>
        <button id="secondaryFilterSidebarClose" title="关闭">×</button>
      </div>
      <div id="secondaryFilterSidebarContent">
        <div id="secondaryFilterSidebarPlaceholder"></div>
        <div id="secondaryFilterSidebarVirtualContent"></div>
      </div>
      <!-- 调整大小手柄（只保留四个角） -->
      <div class="secondary-filter-resize-handle ne" data-direction="ne"></div>
      <div class="secondary-filter-resize-handle nw" data-direction="nw"></div>
      <div class="secondary-filter-resize-handle se" data-direction="se"></div>
      <div class="secondary-filter-resize-handle sw" data-direction="sw"></div>
    </div>

    <!-- 过滤面板最小化按钮 -->
    <div id="filteredPanelMinimizedBtn" title="点击展开过滤面板">
      <span id="filteredPanelMinimizedCount">0</span>
    </div>


    <!-- CSV表格视图面板 -->
    <div id="csvTablePanel">
      <div id="csvTablePanelHeader" title="单击头部切换全屏/还原">
        <div class="csv-table-header-left">
          <span>📊 CSV表格视图</span>
          <span id="csvTableInfo"></span>
        </div>
        <div class="csv-table-header-right">
          <button id="csvTableCloseBtn" title="关闭表格">×</button>
        </div>
      </div>
      <div id="csvTablePanelContent">
        <div id="csvTablePlaceholder" class="placeholder-message">
          <div class="placeholder-icon">📊</div>
          <div class="placeholder-text">没有可显示的表格数据</div>
        </div>
        <div id="csvTableContainer"></div>
      </div>
      <!-- CSV表格右键菜单 -->
      <div id="csvTableContextMenu" class="context-menu">
        <div class="context-menu-item" id="csvExportCSV">
          <span>📥</span> 导出为CSV
        </div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-item" id="csvPlotChart">
          <span>📈</span> 绘制曲线图
        </div>
        <div class="context-menu-item" id="csvVlogChart">
          <span>🔋</span> Vlog可视化
        </div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-item" id="csvKeepColumns">
          <span>✓</span> 保留任意列
        </div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-item" id="csvRestoreColumns">
          <span>↺</span> 恢复所有列
        </div>
      </div>
      <!-- 列选择弹窗 -->
      <div id="csvColumnSelector" class="csv-column-selector" style="display: none;">
        <div class="csv-column-selector-header">
          <span>选择要保留的列</span>
          <button id="csvColumnSelectorClose" class="csv-column-selector-close">×</button>
        </div>
        <div class="csv-column-selector-content" id="csvColumnList"></div>
        <div class="csv-column-selector-footer">
          <button id="csvSelectAllColumns">全选</button>
          <button id="csvDeselectAllColumns">全不选</button>
          <button id="csvConfirmColumns" class="primary">确定</button>
        </div>
      </div>
      <!-- 调整大小手柄 -->
      <div class="panel-resize-handle n" data-direction="n"></div>
      <div class="panel-resize-handle e" data-direction="e"></div>
      <div class="panel-resize-handle s" data-direction="s"></div>
      <div class="panel-resize-handle w" data-direction="w"></div>
      <div class="panel-resize-handle nw" data-direction="nw"></div>
      <div class="panel-resize-handle ne" data-direction="ne"></div>
      <div class="panel-resize-handle sw" data-direction="sw"></div>
      <div class="panel-resize-handle se" data-direction="se"></div>
    </div>


    <!-- 右键菜单 -->
    <div id="contextMenu" class="context-menu">
      <!-- 仅为CSV表格保留的功能 -->
    </div>
    
    <!-- 展开的过滤输入框对话框 -->
    <div id="filterDialog">
      <div id="filterChipBar">
        <div id="filterChipContainer" class="filter-chip-container"></div>
        <textarea id="filterDialogTextarea" style="position: absolute; opacity: 0; pointer-events: none; height: 100%;"></textarea>
      </div>
      <div id="filterDialogContent">
        <div class="filter-dialog-input-area">
          <!-- 历史关键词列表 -->
          <div id="filterHistorySuggestions" class="filter-history-suggestions hidden">
            <div id="filterHistoryList" class="filter-history-list-scroll"></div>
          </div>
          <!-- 搜索输入 -->
          <div class="filter-dialog-search-row">
            <input type="text" id="filterHistorySearchInput" class="filter-history-search-input" placeholder="搜索关键词，回车添加到过滤列表，Shift+回车同步保存到词库" />
          </div>
        </div>
        <div id="filterDialogKeywords">
          <strong>当前过滤关键词：</strong> <span id="currentFilterKeywords">无</span>
        </div>
        <div id="filterDialogButtons">
          <button id="clearFilterDialog">清空</button>
          <button id="applyFilterDialog">应用过滤</button>
        </div>
      </div>
    </div>

    <!-- 过滤结果框右键菜单 -->
    <div id="filterContextMenu" class="context-menu">
      <!-- 颜色选项横向展示区域 -->
      <div class="color-options-grid">
        <div class="context-menu-item color-option" id="highlightRed" title="红色高亮">
          <span style="background:red;"></span>
        </div>
        <div class="context-menu-item color-option" id="highlightGreen" title="绿色高亮">
          <span style="background:green;"></span>
        </div>
        <div class="context-menu-item color-option" id="highlightBlue" title="蓝色高亮">
          <span style="background:blue;"></span>
        </div>
        <div class="context-menu-item color-option" id="highlightYellow" title="黄色高亮">
          <span style="background:orange;"></span>
        </div>
        <div class="context-menu-item color-option" id="highlightPurple" title="紫色高亮">
          <span style="background:purple;"></span>
        </div>
        <div class="context-menu-item color-option" id="highlightCyan" title="青色高亮">
          <span style="background:cyan;"></span>
        </div>
        <div class="context-menu-item color-option" id="highlightPink" title="粉色高亮">
          <span style="background:pink;"></span>
        </div>
        <div class="context-menu-item color-option" id="highlightLime" title="青柠高亮">
          <span style="background:lime;"></span>
        </div>
        <div class="context-menu-item color-option" id="highlightBrown" title="棕色高亮">
          <span style="background:brown;"></span>
        </div>
        <div class="context-menu-item color-option" id="highlightGray" title="灰色高亮">
          <span style="background:gray;"></span>
        </div>
        <div class="context-menu-item color-option" id="highlightCustom" title="自定义颜色...">
          <span style="background:linear-gradient(135deg, red, orange, yellow, green, blue, indigo, violet);"></span>
        </div>
      </div>
      <div class="context-menu-separator"></div>
      <div class="context-menu-item" id="removeCurrentHighlight">
        <span>🗑️</span> 移除当前文本高亮
      </div>
      <div class="context-menu-item" id="excludeSelectedLines">
        <span>❌</span> 去除选中内容的行
      </div>
      <div class="context-menu-item" id="clearHighlights">
        <span>✖</span> 清除所有高亮
      </div>
      <!-- UTC转换按钮已移除 -->
    </div>

    <!-- 自定义颜色选择器 -->
    <input type="color" id="highlightColorPicker" style="display:none; position:fixed; z-index:10001;" />

    <!-- ============================================================ -->
    <!-- Layer 0: Console guard (must load before everything else)     -->
    <!-- ============================================================ -->
    <script src="renderer/js/core/console-guard.js"></script>

    <!-- ============================================================ -->
    <!-- Layer 1: 核心基础设施                                          -->
    <!-- ============================================================ -->
    <script src="renderer/js/utils/constants.js"></script>
    <script src="renderer/js/core/event-bus.js"></script>
    <script src="renderer/js/core/state.js"></script>
    <script src="renderer/js/utils/idb-storage.js"></script>
    <script src="renderer/js/core/dom-elements.js"></script>
    <script src="renderer/js/utils/helpers.js"></script>

    <!-- ============================================================ -->
    <!-- Layer 2: Worker管理器 + 外部工具集成                           -->
    <!-- ============================================================ -->
    <script src="renderer/js/utils/worker-manager.js"></script>
    <script src="renderer/js/highlight-worker-manager.js"></script>

    <!-- ============================================================ -->
    <!-- Layer 3: 功能模块                                              -->
    <!-- ============================================================ -->
    <script src="renderer/js/services/log-interceptor/index.js"></script>
    <script src="renderer/js/services/csv-table-renderer/index.js"></script>
